name: Publish to OrcaCloud

on:
  push:
    branches:
      - main
    paths:
      - "anysharik_cloud/pyproject.toml"
      - "anysharik_cloud/anysharik_cloud/plugin.py"
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  PLUGIN_FILES: "anysharik_cloud/dist/anysharik-*-py3-none-any.whl"
  PUBLISH_URL: "https://api.orcaslicer.com/api/v1/plugin-publish/plugins/37750ef7-1b80-4137-9492-c8b34521f2ef/releases"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          def parse_semver(v: str) -> tuple[int, int, int]:
              if not re.fullmatch(r"\d+\.\d+\.\d+", v):
                  raise SystemExit(f"Version must be MAJOR.MINOR.PATCH (got: {v!r})")
              return tuple(int(part) for part in v.split("."))

          with open("anysharik_cloud/pyproject.toml", "rb") as f:
              project_version = tomllib.load(f)["project"]["version"]

          plugin_text = Path("anysharik_cloud/anysharik_cloud/plugin.py").read_text(encoding="utf-8")
          header_match = re.search(r'^# version = "([^"]+)"$', plugin_text, re.MULTILINE)
          if not header_match:
              raise SystemExit("Could not find '# version = \"...\"' in plugin.py")
          plugin_version = header_match.group(1)

          parse_semver(project_version)
          if project_version != plugin_version:
              raise SystemExit(f"Version mismatch: pyproject={project_version}, plugin.py={plugin_version}")

          event_name = os.environ["GITHUB_EVENT_NAME"]
          should_publish = False

          if event_name == "release":
              tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              parse_semver(tag_version)
              if tag_version != project_version:
                  raise SystemExit(
                      f"Version mismatch: tag={tag_version}, pyproject={project_version}, plugin.py={plugin_version}"
                  )
              should_publish = True
          elif event_name == "push":
              before = os.environ.get("GITHUB_EVENT_BEFORE", "")
              if not before or set(before) == {"0"}:
                  should_publish = True
              else:
                  prev_raw = subprocess.run(
                      ["git", "show", f"{before}:anysharik_cloud/pyproject.toml"],
                      capture_output=True,
                      text=True,
                  )
                  if prev_raw.returncode != 0:
                      should_publish = True
                  else:
                      prev_version = tomllib.loads(prev_raw.stdout)["project"]["version"]
                      should_publish = parse_semver(project_version) > parse_semver(prev_version)
                      print(f"Previous version: {prev_version}, current version: {project_version}")

          print(f"should_publish={str(should_publish).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_publish={str(should_publish).lower()}\n")
              out.write(f"version={project_version}\n")
          PY
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Build universal plugin wheel
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel ./anysharik_cloud --no-deps --wheel-dir ./anysharik_cloud/dist
          python - <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          dist = Path("anysharik_cloud/dist")
          wheels = list(dist.glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")

          source = wheels[0]
          target = source
          temporary = target.with_suffix(".whl.tmp")
          with zipfile.ZipFile(source, "r") as src, zipfile.ZipFile(temporary, "w") as dst:
              for info in src.infolist():
                  data = src.read(info.filename)
                  if info.filename.endswith(".dist-info/METADATA"):
                      data = data.replace(b"\r\n", b"\n")
                  dst.writestr(info, data)
          temporary.replace(target)
          PY

      - name: Publish release to OrcaCloud
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          if [[ -z "$oidc_token" || "$oidc_token" == "null" ]]; then
            echo "GitHub did not provide an OrcaCloud OIDC token" >&2
            exit 1
          fi

          version="${{ steps.version.outputs.version }}"
          changelog="$(jq -r '.release.body // .head_commit.message // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [[ "${#args[@]}" -eq 1 ]]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi

          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            "$PUBLISH_URL")"
          if [[ "$status" != "201" ]]; then
            echo "OrcaCloud publish failed with HTTP $status" >&2
            jq -c '.error // .' response.json >&2 || true
            exit 1
          fi
          jq -c --arg status "$status" '{status: $status, version, level: .security.level}' response.json
